name: agent progress

# Rebuilds agent_progress.json (total + neighborhood blocks of Adresses.xlsx — no addresses, no index)
# for the Arnona_Agent site. The site reads the routine's position from ./index directly, so this runs
# ONLY by hand, after a new Adresses.xlsx was pushed to the private bucket — never on a routine push,
# so it never races the routine's `git push` of ./index.
# Needs the SUPABASE_SERVICE_KEY repository secret (the address list is not in git).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-progress
  cancel-in-progress: false

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Build agent_progress.json
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_KEY secret is not set — cannot read Adresses.xlsx from the bucket"
            exit 1
          fi
          python3 agent_progress.py
          rm -f Adresses.xlsx
      - name: Commit if changed
        run: |
          git diff --quiet -- agent_progress.json && { echo "no change"; exit 0; }
          git config user.name "agent-progress[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_progress.json
          git commit -m "agent_progress.json: rebuilt from the address list"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
